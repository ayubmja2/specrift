
info:
  title: Weather API
  version: 1.0.0
paths:
  /weather/{city}:
    get:
      parameters:
        - name: city
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current weather
          content:
            application/json:
              schema:
                type: object
                properties:
                  temp:
                    type: number
                  city:
                    type: string