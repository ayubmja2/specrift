[project]
name = "specrift"
version = "0.1.0"
description = "Detect breaking changes between OpenAPI spec versions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openapi-spec-validator>=0.9.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
